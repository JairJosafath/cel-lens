apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: The desired state.
              properties:
                labels:
                  type: object
                  additionalProperties:
                    type: string
                name:
                  type: string
                ports:
                  type: array
                  items:
                    type: string
              x-kubernetes-validations:
                - rule: "self.ports.size() > 0"
                - rule: "self.labels.size() > 0"
                - rule: "self.?name.hasValue()"
                - rule: "self.labels[?'a'].hasValue()"
                - rule: "optional.of(self.name).hasValue()"
                - rule: "self.?ports[0].size()"
                - rule: "(self.?name).hasValue()"
                - rule: "optional.of(')').hasValue()"
                - rule: "( self.?name ).hasValue()"
                - rule: "self.labels[']'].size() > 0"
                - rule: "a) + ( self.?name).hasValue()"
                - rule: self.labels['\']'].size() > 0
                - rule: self.ports.all(p, r'\' != '' && p.size() > 0)
                - rule: string(r'\').startsWith('a')
