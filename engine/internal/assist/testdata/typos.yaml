apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                maxReplicas:
                  type: integer
                name:
                  type: string
                replicaA:
                  type: integer
                replicaB:
                  type: integer
              x-kubernetes-validations:
                - rule: self.maxReplica >= 0
                - rule: self.name.startWith('w')
                - rule: self.replicaC >= 0
                - rule: self.zzzzzz >= 0
                - rule: self.name.zzzzzz()
                - rule: self.name.size() > 0 && self.maxReplicas > 0
                - rule: sizee(self.name) > 0
