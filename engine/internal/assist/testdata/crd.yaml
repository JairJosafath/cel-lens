apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: The desired state.
              properties:
                replicas:
                  type: integer
                  description: How many copies to run.
                name:
                  type: string
                ports:
                  type: array
                  items:
                    type: object
                    properties:
                      port:
                        type: integer
              x-kubernetes-validations:
                - rule: "self.replicas >= 0 && self.name.startsWith('w')"
                  message: bad
                - rule: |
                    self.ports.all(p, p.port > 0)
                  message: ports
