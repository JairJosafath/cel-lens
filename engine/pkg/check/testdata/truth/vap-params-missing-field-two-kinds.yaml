name: vap-params-missing-field-two-kinds
version: v1.37.0
policy: |
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingAdmissionPolicy
  metadata:
    name: demo
  spec:
    paramKind: {apiVersion: v1, kind: ConfigMap}
    matchConstraints:
      resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], resources: [deployments], operations: [CREATE, UPDATE]}
      - {apiGroups: [apps], apiVersions: [v1], resources: [statefulsets], operations: [CREATE, UPDATE]}
    validations:
      - expression: "params.dataa.size() > 0"
typeChecking:
  - "apps/v1, Kind=Deployment: ERROR: <input>:1:7: undefined field 'dataa'"
  - "apps/v1, Kind=StatefulSet: ERROR: <input>:1:7: undefined field 'dataa'"
