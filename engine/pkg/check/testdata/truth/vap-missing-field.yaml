name: vap-missing-field
version: v1.37.0
policy: |
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingAdmissionPolicy
  metadata:
    name: demo
  spec:
    matchConstraints:
      resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], resources: [deployments], operations: [CREATE, UPDATE]}
    validations:
      - expression: "object.spec.additionalContainers.size() == 0"
typeChecking:
  - "apps/v1, Kind=Deployment: ERROR: <input>:1:12: undefined field 'additionalContainers'"
