name: vap-missing-field-two-kinds
version: v1.37.0
policy: |
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingAdmissionPolicy
  metadata:
    name: demo
  spec:
    matchConstraints:
      resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], resources: [deployments], operations: [CREATE, UPDATE]}
      - {apiGroups: [apps], apiVersions: [v1], resources: [statefulsets], operations: [CREATE, UPDATE]}
    validations:
      - expression: "object.spec.serviceName != ''"
typeChecking:
  - "apps/v1, Kind=Deployment: ERROR: <input>:1:12: undefined field 'serviceName'"
