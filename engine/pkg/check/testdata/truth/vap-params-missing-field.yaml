name: vap-params-missing-field
version: v1.37.0
divergence: the engine types ConfigMap params.data as an open string map and reports nothing; the API server reports undefined field 'dataa'
policy: |
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingAdmissionPolicy
  metadata:
    name: demo
  spec:
    paramKind: {apiVersion: v1, kind: ConfigMap}
    matchConstraints:
      resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], resources: [deployments]}
    validations:
      - expression: "params.data.dataa == 'x'"
typeChecking:
  - "apps/v1, Kind=Deployment: ERROR: <input>:1:12: undefined field 'dataa'"
