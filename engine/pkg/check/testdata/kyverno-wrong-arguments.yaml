# want: 11:24-11:29 found no matching overload for 'math.round'
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: p
spec:
  validations:
    - expression: image.containsDigest(1)
    - expression: math.round("x") > 1
