# api-server: the two versions have the same schema, so the API server reports the cost error once, on spec.validation
# want: 30:31-30:80 estimated cost 2.3T is over the per-expression budget of 10M for a rule
# want: 48:31-48:80 estimated cost 2.3T is over the per-expression budget of 10M for a rule
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names: {plural: widgets, singular: widget, kind: Widget, listKind: WidgetList}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                    x-kubernetes-validations:
                      - rule: self.name.matches("^[a-z]([-a-z0-9]*[a-z0-9])?$")
    - name: v2
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                    x-kubernetes-validations:
                      - rule: self.name.matches("^[a-z]([-a-z0-9]*[a-z0-9])?$")
