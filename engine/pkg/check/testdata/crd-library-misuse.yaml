# api-server: the rule is rejected with "compilation failed: ERROR: <input>:1:N: found no matching overload
# for 'quantity' applied to '(int)'".
# want: 22:21-22:29 found no matching overload for 'quantity'
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names: {plural: widgets, singular: widget, kind: Widget, listKind: WidgetList}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            replicas: {type: integer}
          x-kubernetes-validations:
            - rule: quantity(self.replicas).isGreaterThan(quantity('1'))
