apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: limits.example.com
spec:
  group: example.com
  scope: Namespaced
  names: { plural: limits, singular: limit, kind: Limit, listKind: LimitList }
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas: { type: integer }
              x-kubernetes-validations:
                - rule: self.replicas <= 10
                  message: at most 10 replicas
