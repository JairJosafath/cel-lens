apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: no-latest-tag
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  variables:
    - name: images
      expression: object.spec.containers.map(c, c.image)
  validations:
    - expression: variables.images.all(image, !image.endsWith(':latest'))
      message: no container may use the latest tag
    - expression: object.spec.containers.all(c, has(c.resources) && has(c.resources.limits))
      messageExpression: "'pod ' + object.metadata.name + ' sets no resource limits'"
