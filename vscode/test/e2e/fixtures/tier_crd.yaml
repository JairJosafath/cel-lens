apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tiers.example.com
spec:
  group: example.com
  scope: Namespaced
  names: { plural: tiers, singular: tier, kind: Tier, listKind: TierList }
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                tier: { type: string }
              x-kubernetes-validations:
                - rule: self.tier.size() <= 8
                  message: at most 8 characters
