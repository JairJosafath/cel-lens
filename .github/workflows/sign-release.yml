name: Sign release

# Signs the files of a release with Sigstore. The signing identity is this
# workflow's own OIDC token, so there is no key to keep. A signature says the
# file is the one this workflow saw; it says nothing about how the file was built.
on:
  release:
    types: [published]
  # For the releases published before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to sign, such as core-v0.27.0
        required: true
        type: string

# One run at a time per tag. A run in progress finishes: cancelled, it could
# leave a release with signatures for only some of its files.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: read-all

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads the signatures to the release
      id-token: write # the identity Sigstore signs with
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The tag reaches the script through env, never as an expression in its
      # text, and gh gets it after --: there a tag that looks like a flag, such
      # as --archive=zip, is still the tag, and no release has it. For an empty
      # tag gh would take the latest release, so the script stops first.
      #
      # It also stops unless the run started from main or from a tag, the refs
      # whose signatures the command in SECURITY.md accepts: a run by hand from
      # another branch would put signatures that command refuses over the ones
      # the release has.
      #
      # Every signature is verified before any is uploaded. The certificate
      # names the workflow file at the ref the run started from, which is
      # GITHUB_WORKFLOW_REF: refs/tags/<tag> when a release is published,
      # refs/heads/main for a run by hand from main.
      #
      # A second run downloads the signatures of the first along with the
      # files. It signs the files again, uploads over the old signatures, and
      # signs no signature.
      #
      # It signs no build provenance either, the .intoto.jsonl file of a
      # release that release.yml made: that file is an attestation, signed
      # when it was made.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "$TAG" ]; then
            echo "No tag was given. Run this workflow again with the tag of the release to sign." >&2
            exit 1
          fi
          case "$GITHUB_REF" in
          refs/heads/main | refs/tags/?*) ;;
          *)
            echo "Run this workflow from main, not from $GITHUB_REF: the command in SECURITY.md refuses a signature made from another branch." >&2
            exit 1
            ;;
          esac
          gh release download --repo "$GITHUB_REPOSITORY" --dir assets -- "$TAG"
          signed=0
          for file in assets/*; do
            if [[ $file == *.sigstore.json || $file == *.intoto.jsonl ]]; then
              continue
            fi
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then
            echo "The release $TAG has no file to sign." >&2
            exit 1
          fi
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$TAG" assets/*.sigstore.json
