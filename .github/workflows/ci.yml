name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
      - run: go test ./...
        working-directory: engine

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci && npm test
        working-directory: vscode

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # govulncheck has no ignore list, and an advisory without symbols marks
      # every call into its module. So the action writes what it finds as JSON,
      # which never fails, and the step after it fails on any advisory the
      # engine calls that engine/osv-scanner.toml does not leave aside.
      #
      # The action checks the repository out itself. Its go-version-input is
      # 'stable' unless set, and the file's version is used only without it.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ''
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
          work-dir: engine
          go-package: ./...
          output-format: json
          output-file: govulncheck.json
      - run: node .github/scripts/govulncheck-left.mjs engine/osv-scanner.toml govulncheck.json
