name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The YAML and the steps that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The extension or engine version, and the Kubernetes version it matches.
    validations:
      required: true
