# Dependabot proposes updates every week: the minor and patch updates of an
# ecosystem in one pull request, each major update in its own. Its pull
# requests are not merged here; see "Dependency updates" in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(engine)
    groups:
      engine-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(vscode)
    groups:
      vscode-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # @types/vscode may not be newer than engines.vscode in package.json, or
      # the extension does not package. The two move together, by hand, when
      # the extension asks for a newer VS Code.
      - dependency-name: '@types/vscode'
      # The major of @types/node names a Node version. It moves by hand, with
      # the Node of VS Code's extension host; its other updates are proposed.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
